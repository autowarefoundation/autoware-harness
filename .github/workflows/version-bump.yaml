name: version-bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: The type of version bump
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set git config
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
        run: |
          # Commit as the GitHub App bot so that the DCO sign-off resolves to a real user
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Generate PR branch name
        id: generate-branch-name
        run: echo "branch_name=bump/main-with-${{ inputs.bump }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Create a new working branch for the PR
        run: |
          git fetch --tags origin main
          git checkout -b "${{ steps.generate-branch-name.outputs.branch_name }}" origin/main

      - name: Compute next version
        id: version
        run: |
          IFS=. read -r major minor patch <<< "${{ steps.pre-check.outputs.current }}"
          case "${{ inputs.bump }}" in
            major)
              major=$((major + 1)); minor=0; patch=0
              ;;
            minor)
              minor=$((minor + 1)); patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac
          echo "next=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Bump version and push the branch
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          .github/scripts/bump-manifest-versions.sh "$NEXT_VERSION"
          git commit --signoff --all --message "chore(release): bump version to $NEXT_VERSION"
          git push origin "${{ steps.generate-branch-name.outputs.branch_name }}"

      - name: Create pull request
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          CURRENT_VERSION: ${{ steps.pre-check.outputs.current }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          # Build the body with printf so that no YAML indentation leaks in and
          # turns the second paragraph into a Markdown code block
          body=$(printf '%s\n\n%s\n' \
            "Bumps the plugin manifest version from \`$CURRENT_VERSION\` to \`$NEXT_VERSION\` (\`${{ inputs.bump }}\`)." \
            "Merging this PR (kept labeled \`$LABEL_NAME\`) triggers the \`tag-release\` job, which tags and drafts the GitHub Release.")

          # The label is what the tag-release job keys off after the merge
          if gh pr create \
            --base main \
            --head "${{ steps.generate-branch-name.outputs.branch_name }}" \
            --draft \
            --title "chore(release): $NEXT_VERSION" \
            --body "$body" \
            --label "release:bump-version"; then
            echo "✅ Successfully created a PR."
            echo "pr_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Failed to create a PR."
            echo "pr_created=false" >> "$GITHUB_OUTPUT"
          fi

      # (Idempotent) Delete the remote branch if the PR creation failed
      - name: Delete the remote branch if the PR creation failed
        if: ${{ steps.create-pr.outputs.pr_created == 'false' }}
        run: |
          echo "Deleting the remote branch ${{ steps.generate-branch-name.outputs.branch_name }} ..."
          git push origin --delete "${{ steps.generate-branch-name.outputs.branch_name }}"
          exit 1

  tag-release:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'release:bump-version')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(jq -r .version .claude-plugin/plugin.json)
          gh release create "$tag" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "v$tag" \
            --generate-notes \
            --draft

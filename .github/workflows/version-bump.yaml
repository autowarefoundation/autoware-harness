name: version-bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to bump
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
  push:
    branches:
      - main
    paths:
      - .claude-plugin/plugin.json

permissions:
  contents: read

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          current=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          current=${current:-0.0.0}
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major)
              major=$((major + 1)); minor=0; patch=0
              ;;
            minor)
              minor=$((minor + 1)); patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Bump plugin manifests
        run: .github/scripts/bump-manifest-versions.sh "${{ steps.version.outputs.next }}"

      - name: Open release pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): bump version to ${{ steps.version.outputs.next }}"
          signoff: true
          branch: release/${{ steps.version.outputs.next }}
          delete-branch: true
          base: main
          draft: true
          title: "chore(release): ${{ steps.version.outputs.next }}"
          body: |
            Bumps the plugin manifest version from `${{ steps.version.outputs.current }}` to `${{ steps.version.outputs.next }}` (`${{ inputs.bump }}`).

            See [docs/release.md](../../docs/release.md) for the versioning policy.

            Merging this PR to `main` triggers the `tag-release` job below, which tags `${{ steps.version.outputs.next }}` and drafts the GitHub Release.

  tag-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version
        run: |
          current=$(jq -r .version .claude-plugin/plugin.json)
          latest=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          latest=${latest:-0.0.0}
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$latest" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and draft release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.current }}
        run: |
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "v$TAG" \
            --generate-notes \
            --draft

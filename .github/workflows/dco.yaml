name: DCO

on:
  pull_request:
jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python 3.x
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Check DCO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip3 install -U dco-check
          dco-check --verbose --exclude-pattern '(pre-commit-ci|dependabot)\[bot\]@users\.noreply\.github\.com'

name: pre-commit

on:
  pull_request:

jobs:
  pre-commit-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: pre-commit/action@v3.0.1

      - uses: pre-commit-ci/lite-action@v1.2.0
        if: always()
        with:
          msg: "style(pre-commit): autofix"

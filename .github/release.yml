changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 💥 Breaking Changes
      labels:
        - breaking-change
    - title: 🚀 Features
      labels:
        - feat
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - fix
        - bug
    - title: 📝 Documentation
      labels:
        - docs
        - documentation
    - title: 📦 Dependencies
      labels:
        - dependencies
        - github-actions
        - pre-commit
    - title: 🧹 Other Changes
      labels:
        - "*"
